<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>💰 Expense &amp; Budget Visualizer</h1>

    <!-- ===== Summary Cards ===== -->
    <div class="summary">
      <div class="summary-card income">
        <span class="label">Total Pemasukan</span>
        <span class="amount" id="total-income">Rp 0</span>
      </div>
      <div class="summary-card expense">
        <span class="label">Total Pengeluaran</span>
        <span class="amount" id="total-expense">Rp 0</span>
      </div>
      <div class="summary-card balance">
        <span class="label">Saldo</span>
        <span class="amount" id="balance">Rp 0</span>
      </div>
    </div>

    <!-- ===== Input Form ===== -->
    <div class="form-card">
      <h2>Tambah Transaksi</h2>
      <form id="transaction-form">
        <div class="form-group">
          <label for="description">Deskripsi</label>
          <input
            type="text"
            id="description"
            placeholder="Contoh: Gaji, Makan siang..."
            required
          />
        </div>
        <div class="form-group">
          <label for="amount">Jumlah (Rp)</label>
          <input
            type="number"
            id="amount"
            placeholder="Contoh: 50000"
            min="1"
            required
          />
        </div>
        <div class="form-group">
          <label for="type">Tipe</label>
          <select id="type">
            <option value="income">Pemasukan</option>
            <option value="expense">Pengeluaran</option>
          </select>
        </div>
        <div class="form-group">
          <label for="category">Kategori</label>
          <select id="category">
            <option value="Gaji">Gaji</option>
            <option value="Makanan">Makanan</option>
            <option value="Transport">Transport</option>
            <option value="Belanja">Belanja</option>
            <option value="Hiburan">Hiburan</option>
            <option value="Kesehatan">Kesehatan</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
        <div class="form-group">
          <label for="date">Tanggal</label>
          <input type="date" id="date" required />
        </div>
        <button type="submit" class="btn-add">+ Tambah Transaksi</button>
      </form>
    </div>

    <!-- ===== Charts ===== -->
    <div class="chart-section">
      <div class="chart-card">
        <h2>Pengeluaran per Kategori</h2>
        <canvas id="category-chart"></canvas>
      </div>
      <div class="chart-card">
        <h2>Pemasukan vs Pengeluaran</h2>
        <canvas id="balance-chart"></canvas>
      </div>
    </div>

    <!-- ===== Transaction List ===== -->
    <div class="transaction-section">
      <div class="transaction-header">
        <h2>Riwayat Transaksi</h2>
        <button class="btn-clear" id="clear-all">🗑 Hapus Semua</button>
      </div>
      <div id="transaction-list">
        <p class="empty-state">Belum ada transaksi. Tambahkan transaksi pertama Anda!</p>
      </div>
    </div>
  </div>

  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- App logic -->
  <script src="js/app.js"></script>
</body>
</html>
